name: CI

# GENERATED by saltare-machina's bin/sync-workflows — do not edit.
# Source: ci/workflows/saltare-omarchy.yml. Edit there and run `bin/sync-workflows saltare-omarchy`.

# Dispatch-only, deliberately. Everything in this repo runs on Linux, which is
# to say it runs on the workstation — `bin/ci` before a push is the real gate
# (`bin/ci --install-hook` wires it to `git push`). This workflow is the
# clean-machine second opinion, asked for with `bin/ci --remote`.
#
# Two steps skip here and cannot not skip: `omarchy plugin validate` needs
# Omarchy, and the golden comparison needs saltare-cli checked out beside this
# repo. Both are gates the workstation run does hold, and both say so in the
# summary rather than reading as passes.
#
# Note, 2026-09-18: GitHub registers a workflow when a push *touches the file*,
# and until this line landed it had never registered this one — the repo's
# `workflow_dispatch` existed on master and `bin/ci --remote` answered
# "workflow ci.yml not found". If a new repo's remote gate 404s, push a change
# to this file rather than looking for the fault in the YAML.
on:
  workflow_dispatch:
    inputs:
      tier:
        description: Which tier to run
        type: choice
        default: all
        options: [all, linux]

jobs:
  node:
    if: inputs.tier == 'all' || inputs.tier == 'linux'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # The job sets up the environment; bin/ci owns the steps. Anything added
      # here that is not environment belongs in saltare-machina's
      # ci/repos/saltare-omarchy.sh instead, or the two gates drift.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: bin/ci --tier linux
